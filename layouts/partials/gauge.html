<div class="viz" data-gauge>
  <div class="viz-head"><h2 class="viz-title">The Dimension Gauge</h2><span class="muted small">one breath ≈ 6–8 s · amplitude = breathing room</span></div>
  <div class="gauge-layout">
    <div class="gauge-side">
      <div class="gauge-label">Effective dimension</div>
      <div class="gauge-number" data-gauge-num>—</div>
      <div class="muted small num" data-gauge-date>—</div>
      <div class="gauge-read" data-gauge-read></div>
      <div class="viz-controls" style="padding:14px 0 0;border:0">
        <input type="range" min="0" max="0" step="1" value="0" aria-label="Scrub readings">
      </div>
      <div class="small muted">Scrub the history of readings. The dashed amber ring is the T2 disease line: three consecutive readings under it and the machine opens an issue.</div>
    </div>
    <div class="viz-body"><canvas role="img" aria-label="A slowly pulsing circle whose size tracks the market's effective dimension"></canvas></div>
  </div>
</div>
